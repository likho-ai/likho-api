}

type RecordingPage {
  """Pass as `after` to get the next page."""
  endCursor: String
  hasMore: Boolean!
  items: [Recording!]!
}

enum RecordingStatus {
  done
  failed
  queued
  ready
  transcribing
  uploaded
  uploading
}

input RegisterSpeechModelInput {
  """s3://likho-models/... for a fine-tuned model."""
  artifactUri: String
  baseModelId: String
  description: String
  languages: [String!]

  """<engine>/<name>, e.g. faster-whisper/likho-2026-10."""
  registryId: String!
}

input RequestImportInput {
  """The call’s id in the dialer (its crt_object_id)."""
  externalId: String!

  """Which connector; empty = the default one."""
  source: String

  """Transcribe once stored (default true)."""
  transcribe: Boolean
}

input RequestUploadInput {
  """Facts about the call: campaign, agent, ..."""
  attributes: [AttributeInput!]
  contentType: String

  """Your own id for the call."""
  externalId: String
  originalName: String!

  """When known: the same content is not uploaded twice."""
  sha256: String
  sizeBytes: Float!

  """Where the call comes from (a connector’s name); API keys only."""
  source: String
}

"""
admin manages people and settings; member works with recordings; viewer reads and searches.
"""
enum Role {
  admin
  member
  viewer
}

input SaveSearchInput {
  filter: SearchFilter

  """A short name, e.g. "refunds, sales, last week"."""
  name: String!

  """The words to search for."""
  query: String!
}

"""A search kept for later, shared by the workspace."""
type SavedSearch {
  createdAt: DateTime!

  """Who saved it."""
  createdBy: String
  filter: SavedSearchFilter!
  id: String!
  name: String!
  query: String!
}

"""The filter of a saved search, as it was saved."""
type SavedSearchFilter {
  agent: String
  callSince: DateTime
  callUntil: DateTime
  campaign: String
  disposition: String
  language: String
  recordingId: String
  since: DateTime
  source: String
  until: DateTime
}

input SearchFilter {
  """The agent attribute, exactly."""
  agent: String

  """Calls from this moment (their call time)."""
  callSince: DateTime

  """Calls up to this moment (their call time)."""
  callUntil: DateTime

  """The campaign attribute, exactly."""
  campaign: String

  """The disposition attribute, exactly."""
  disposition: String

  """A detected language (ISO 639-1)."""
  language: String

  """Only this recording."""
  recordingId: String

  """Transcripts created from this moment."""
  since: DateTime

  """Where the call came from: upload, api, or a connector’s name."""
  source: String

  """Transcripts created up to this moment."""
  until: DateTime
}

type SearchHit {
  endSeconds: Float!

  """The Hinglish line with every match inside <mark>…</mark>."""
  highlightRoman: String!

  """The script line with every match inside <mark>…</mark>."""
  highlightScript: String!
  language: String!

  """The recording the line is from."""
  recording: Recording!
  segmentIndex: Int!
  startSeconds: Float!
  textRoman: String!
  textScript: String!
  transcriptId: String!
}

type SearchPage {
  hits: [SearchHit!]!
  page: Int!
  pageSize: Int!
  processingMs: Int!

  """Lines matched in all."""
  total: Int!
}

type Segment {
  endSeconds: Float!
  index: Int!
  startSeconds: Float!

  """Layer 2: Hinglish."""
  textRoman: String!

  """Layer 1: as spoken, in the script of the language."""
  textScript: String!
}

"""One service of the platform and whether it answers right now."""
type ServiceStatus {
  """Where likho-api reaches it."""
  address: String!

  """What it said, or why it did not answer."""
  detail: String!

  """How long the answer took, in milliseconds."""
  latencyMs: Float!
  name: String!
  ok: Boolean!
}

type Settings {
  """Queue a job as soon as a recording is ready."""
  autoTranscribe: Boolean!
  dialer: DialerSettings!
}

"""The settings to change; a field left out keeps its value."""
input SettingsInput {
  autoTranscribe: Boolean
  dialer: DialerSettingsInput
}

"""A speech model the transcription service can load."""
type SpeechModel {
  """Where its weights are; empty for an engine’s own published sizes."""
  artifactUri: String!

  """The model this one was fine-tuned from, if any."""
  baseModelId: String!
  createdAt: DateTime
  description: String!
  engine: String!
  id: String!

  """True for the model new transcriptions use."""
  isDefault: Boolean!

  """Languages it is meant for; empty = any."""
  languages: [String!]!
  latestEvaluationId: String

  """Its newest completed evaluation, if any."""
  latestScores: ErrorRates
  name: String!

  """<engine>/<name>, e.g. faster-whisper/turbo."""
  registryId: String!

  """available or retired."""
  status: String!
}

